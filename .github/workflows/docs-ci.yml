name: Documentation CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "Doxyfile"
      - "port/**"
      - "examples/**"
      - "upstream/include/**"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build MkDocs manual
        run: mkdocs build --strict

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Build Doxygen API reference
        run: |
          rm -rf build/doxygen
          mkdir -p build/doxygen
          doxygen Doxyfile
          test -f build/doxygen/html/index.html
